name: Rebuild MetaData single file

on:
  push:
    branches:
      - metadata-ux-v2
    paths:
      - '.rebuild/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Assemble index.html
        shell: bash
        run: |
          cat .rebuild/part-*.txt > index.html
          test -s index.html
          grep -q '<title>MetaData</title>' index.html
          grep -q 'id="modifierGrid"' index.html
          grep -q 'function clearFields()' index.html

      - name: Remove temporary rebuild files
        shell: bash
        run: |
          rm -rf .rebuild
          rm -f .github/workflows/rebuild-metadata.yml

      - name: Commit assembled application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild MetaData UX V2 as single HTML"
          git push
